<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Design Final Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>My Personal Photo Gallery</h1>
  </header>

  <main>
    <div class="grid">
      <figure>
        <img src="https://picsum.photos/id/1015/600/400" alt="Beautiful landscape with mountains and river">
        <figcaption>
          <p>Explore the peaceful nature with breathtaking mountain views and flowing streams.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1018/600/400" alt="Blue sky with soft white clouds over hills">
        <figcaption>
          <p>The vast open sky gives a sense of freedom and endless possibilities in the wild.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1016/600/400" alt="A dramatic sunset over rocky terrain">
        <figcaption>
          <p>Sunsets bring a calm ending to vibrant days with warm orange and purple hues.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1025/600/400" alt="Dense green forest path wrapped in fog">
        <figcaption>
          <p>Walking through the misty morning woods refreshes both the mind and spirit.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1039/600/400" alt="Majestic snowy mountain peak under sunlight">
        <figcaption>
          <p>High mountain peaks stand tall against harsh winds, symbolizing strength.</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://picsum.photos/id/1043/600/400" alt="Calm lake reflecting the surrounding trees">
        <figcaption>
          <p>Still water creates a mirror-like surface showing nature's perfect symmetry.</p>
        </figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Web Design Course Project. All rights reserved.</p>
  </footer>

</body>
</html>
